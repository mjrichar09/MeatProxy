name: core

# Lane E's core is a plain .NET library with no engine reference (ADR 0028),
# so it builds and tests without Godot installed. That is the property this
# workflow exists to keep true.

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'MeatProxy.sln', '.github/workflows/core.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'MeatProxy.sln', '.github/workflows/core.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore MeatProxy.sln

      - run: dotnet build MeatProxy.sln --configuration Release --no-restore

      - run: dotnet test MeatProxy.sln --configuration Release --no-build --verbosity normal

      # E1's exit criterion, run as a build step: a house you can move through,
      # saved and restored. Fails if any room has become unreachable.
      - name: Walk the house
        run: dotnet run --project src/MeatProxy.Harness --configuration Release --no-build -- --tour

      # E2's debug view. Writing it is a check that every frame of the scripted
      # run still holds; keeping it means a reviewer can open it without .NET.
      - name: Write the debug view
        run: dotnet run --project src/MeatProxy.Harness --configuration Release --no-build -- --view house-monitor.html

      - uses: actions/upload-artifact@v4
        with:
          name: house-monitor
          path: house-monitor.html

      # The same core, compiled to WebAssembly and driven from a page. Open
      # wwwroot/index.html from a local web server; file:// won't load the runtime.
      - name: Publish the live monitor
        run: dotnet publish src/MeatProxy.Web --configuration Release --output web

      - uses: actions/upload-artifact@v4
        with:
          name: live-monitor
          path: web/wwwroot
